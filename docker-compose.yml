version: '3.8'

services:
  v3netbill-backend:
    container_name: v3netbill-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
      - NODE_ENV=development
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
      - SMTP_ENCRYPTION=${SMTP_ENCRYPTION}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - LAPORAN_EMAIL_TUJUAN=${LAPORAN_EMAIL_TUJUAN}
    volumes:
      - ./backend:/app
      - v3netbill-node-modules:/app/node_modules
      - ./data:/data
      - ./frontend/dist:/app/frontend-dist:ro
    networks:
      - postgres-network
    restart: unless-stopped

  v3netbill-frontend:
    container_name: v3netbill-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
    volumes:
      - ./frontend:/app
      - v3netbill-frontend-node-modules:/app/node_modules
    networks:
      - postgres-network
    depends_on:
      - v3netbill-backend
    restart: unless-stopped

networks:
  postgres-network:
    name: war-nt-web_default
    external: true

volumes:
  v3netbill-node-modules:
  v3netbill-frontend-node-modules: